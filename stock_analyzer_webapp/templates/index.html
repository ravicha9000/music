<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stock Analyzer Input</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        form > div { margin-bottom: 10px; }
        label { display: inline-block; width: 100px; }
    </style>
</head>
<body>
    <h1>Stock Analyzer</h1>
    <form method="POST">
        <div>
            <label for="ticker">Ticker Symbol:</label>
            <input type="text" id="ticker" name="ticker" required>
        </div>
        <div>
            <label for="user_type">Report Type:</label>
            <select id="user_type" name="user_type">
                <option value="day_trader">Day Trader</option>
                <option value="portfolio_manager">Portfolio Manager</option>
                <option value="beginner_investor">Beginner Investor</option>
            </select>
        </div>
        <div>
            <button type="submit">Analyze</button>
        </div>
    </form>

    <hr style="margin: 30px 0;">

    <h2>AI Chat</h2>
    <div id="chat_container">
        <div id="chat_responses" style="height: 200px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background-color: #f9f9f9;">
            <!-- AI responses will appear here -->
        </div>
        <form id="chat_form" method="POST" action="{{ url_for('chat_with_ai') }}">
            <input type="text" name="query" placeholder="Ask the AI..." style="width: calc(80% - 10px); padding: 8px; margin-right: 5px; border: 1px solid #ccc; border-radius: 4px;">
            <button type="submit" style="padding: 8px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Send</button>
        </form>
    </div>

    <script>
    document.getElementById('chat_form').addEventListener('submit', async function(event) {
        event.preventDefault(); // Prevent default form submission

        const queryInput = event.target.elements.query;
        const userQuery = queryInput.value.trim();
        const chatResponsesDiv = document.getElementById('chat_responses');

        if (!userQuery) {
            // Optionally, provide feedback if the query is empty
            // queryInput.placeholder = "Please enter a message.";
            return;
        }

        // Display user query
        const userMessageDiv = document.createElement('div');
        userMessageDiv.textContent = "You: " + userQuery;
        userMessageDiv.style.marginBottom = "5px";
        chatResponsesDiv.appendChild(userMessageDiv);
        queryInput.value = ''; // Clear input
        queryInput.placeholder = "Ask the AI..."; // Reset placeholder

        try {
            const response = await fetch("{{ url_for('chat_with_ai') }}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({ query: userQuery })
            });

            const aiMessageDiv = document.createElement('div');
            aiMessageDiv.style.marginBottom = "5px";
            if (response.ok) {
                const aiResponseText = await response.text();
                aiMessageDiv.textContent = "AI: " + aiResponseText;
            } else {
                const errorText = await response.text(); // Get error message from server if available
                aiMessageDiv.textContent = "AI: Error communicating - " + (errorText || response.statusText);
                aiMessageDiv.style.color = "red";
            }
            chatResponsesDiv.appendChild(aiMessageDiv);

        } catch (error) {
            console.error('Chat submission error:', error);
            const errorMessageDiv = document.createElement('div');
            errorMessageDiv.style.marginBottom = "5px";
            errorMessageDiv.textContent = "AI: Network error or server unavailable.";
            errorMessageDiv.style.color = "red";
            chatResponsesDiv.appendChild(errorMessageDiv);
        }
        chatResponsesDiv.scrollTop = chatResponsesDiv.scrollHeight; // Scroll to bottom
    });
    </script>
</body>
</html>
